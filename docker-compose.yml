name: ai-infographic

services:

  comfyui:
    image: yanwk/comfyui-boot:cu128-slim
    container_name: infographic-comfyui
    restart: unless-stopped

    ports:
      - "8188:8188"

    volumes:
      - ./comfyui/models:/root/ComfyUI/models
      - ./comfyui/input:/root/ComfyUI/input
      - ./comfyui/output:/root/ComfyUI/output
      - ./comfyui/workflows:/root/ComfyUI/user/default/workflows

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  infographic:
    build:
      context: ./app

    container_name: infographic-generator
    restart: unless-stopped

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "${APP_PORT:-8090}:8080"

    environment:
      OLLAMA_URL: ${OLLAMA_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_MAX_ATTEMPTS: ${OLLAMA_MAX_ATTEMPTS:-3}
      COMFYUI_URL: ${COMFYUI_URL}
      COMFYUI_CHECKPOINT: ${COMFYUI_CHECKPOINT}
      COMFYUI_MAX_WAIT_SECONDS: ${COMFYUI_MAX_WAIT_SECONDS:-1200}
      TASK_TTL_SECONDS: ${TASK_TTL_SECONDS:-1800}
      TASKS_DIR: ${TASKS_DIR:-/app/tasks}
      MAX_QUEUED_PER_KIND: ${MAX_QUEUED_PER_KIND:-2}
      PROJECT_RETENTION_SECONDS: ${PROJECT_RETENTION_SECONDS:-2592000}
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-3600}
      AUTH_USER: ${AUTH_USER:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}

    volumes:
      - ./output:/app/output
      - ./projects:/app/projects
      - ./tasks:/app/tasks

    depends_on:
      - comfyui

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
