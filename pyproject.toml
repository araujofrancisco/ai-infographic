[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
addopts = "-q"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning"
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["comfyui", "output", "projects", "tasks"]

[tool.ruff.lint]
select = ["F", "E9"]
