{% if retry %}

<form
    class="retry-form"
    method="post"
    action="{{ retry.action }}"
    data-loading
>

    {% for field in retry.fields %}

    <input
        type="hidden"
        name="{{ field.name }}"
        value="{{ field.value }}"
    >

    {% endfor %}

    <button
        type="submit"
        class="retry-button"
    >
        {{ retry.button }}
    </button>

</form>

{% endif %}
